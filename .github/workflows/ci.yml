name: Infra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TF_VERSION: "1.10.5"
  WORKING_DIR: terraform

jobs:
  lint:
    name: Lint Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Init TFLint
        working-directory: ${{ env.WORKING_DIR }}
        run: tflint --init

      - name: Run TFLint
        working-directory: ${{ env.WORKING_DIR }}
        run: tflint --recursive

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: Terraform Plan
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
        run: terraform plan -no-color

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: Terraform Plan
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
        run: terraform plan -no-color

      - name: Import existing OIDC provider if needed
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          OIDC_ARN="arn:aws:iam::${ACCOUNT_ID}:oidc-provider/token.actions.githubusercontent.com"

          if ! terraform state list | grep -q "aws_iam_openid_connect_provider.github"; then
            aws iam get-open-id-connect-provider --open-id-connect-provider-arn "$OIDC_ARN" 2>/dev/null \
              && terraform import aws_iam_openid_connect_provider.github "$OIDC_ARN" || true
          fi

          if ! terraform state list | grep -q "aws_iam_role.github_actions"; then
            aws iam get-role --role-name task-manager-github-actions 2>/dev/null \
              && terraform import aws_iam_role.github_actions task-manager-github-actions || true
          fi

          if ! terraform state list | grep -q "aws_iam_role_policy.github_actions"; then
            aws iam get-role-policy --role-name task-manager-github-actions --policy-name github-actions 2>/dev/null \
              && terraform import aws_iam_role_policy.github_actions task-manager-github-actions:github-actions || true
          fi

      - name: Terraform Apply
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
        run: terraform apply -auto-approve

      - name: Configure kubectl
        working-directory: ${{ env.WORKING_DIR }}
        run: aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name task-manager-eks

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install external-dns
        run: |
          helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/
          helm repo update
          helm upgrade --install external-dns external-dns/external-dns \
            -n kube-system \
            --set provider.name=aws \
            --set env[0].name=AWS_DEFAULT_REGION \
            --set env[0].value=${{ secrets.AWS_REGION }} \
            --set domainFilters[0]=oybek.xyz \
            --set policy=upsert-only \
            --set txtOwnerId=task-manager-eks \
            --set txtPrefix=edns-

      - name: Install AWS Load Balancer Controller
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          LBC_ROLE_ARN=$(terraform output -raw lbc_role_arn)
          VPC_ID=$(terraform output -raw vpc_id)
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            -n kube-system \
            --set clusterName=task-manager-eks \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=${LBC_ROLE_ARN}" \
            --set region=${{ secrets.AWS_REGION }} \
            --set vpcId=${VPC_ID}

      - name: Wait for AWS Load Balancer Controller to be ready
        run: kubectl rollout status deployment/aws-load-balancer-controller -n kube-system --timeout=180s

      - name: Create namespaces and db-secrets
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
        run: |
          RDS_HOST=$(terraform output -raw rds_endpoint)
          declare -A DB_NAMES=([prod]="taskmanager" [dev]="taskmanager_dev")
          for NS in prod dev; do
            DB_URL="postgresql://taskuser:${{ secrets.TF_DB_PASSWORD }}@${RDS_HOST}:5432/${DB_NAMES[$NS]}"
            kubectl create namespace $NS --dry-run=client -o yaml | kubectl apply -f -
            kubectl create secret generic db-secret -n $NS \
              --from-literal=DATABASE_URL="$DB_URL" \
              --dry-run=client -o yaml | kubectl apply -f -
          done
