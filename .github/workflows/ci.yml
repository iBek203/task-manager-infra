name: Infra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Manual action'
        required: true
        default: 'plan'
        type: choice
        options: [plan, apply]

concurrency:
  group: terraform-infra
  cancel-in-progress: false

env:
  TF_VERSION: "1.10.5"
  WORKING_DIR: terraform

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive terraform/
          terraform fmt -check -recursive terraform-sonarqube/

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Init TFLint (main)
        working-directory: ${{ env.WORKING_DIR }}
        run: tflint --init

      - name: Run TFLint (main)
        working-directory: ${{ env.WORKING_DIR }}
        run: tflint --recursive

      - name: Init TFLint (sonarqube)
        working-directory: terraform-sonarqube
        run: tflint --init

      - name: Run TFLint (sonarqube)
        working-directory: terraform-sonarqube
        run: tflint --recursive

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint
        run: |
          helm lint helm/task-manager -f helm/task-manager/values-dev.yaml
          helm lint helm/task-manager -f helm/task-manager/values-prod.yaml

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: lint
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: Terraform Plan
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
        run: terraform plan -no-color

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: lint
    if: >
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init (bootstrap)
        working-directory: terraform/bootstrap
        run: terraform init

      - name: Import existing OIDC/IAM resources into bootstrap state
        working-directory: terraform/bootstrap
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          OIDC_ARN="arn:aws:iam::${ACCOUNT_ID}:oidc-provider/token.actions.githubusercontent.com"

          if ! terraform state list | grep -qF "aws_iam_openid_connect_provider.github"; then
            if aws iam get-open-id-connect-provider --open-id-connect-provider-arn "$OIDC_ARN" >/dev/null 2>&1; then
              terraform import aws_iam_openid_connect_provider.github "$OIDC_ARN"
            fi
          fi

          if ! terraform state list | grep -qF "aws_iam_role.github_actions"; then
            if aws iam get-role --role-name task-manager-github-actions >/dev/null 2>&1; then
              terraform import aws_iam_role.github_actions task-manager-github-actions
            fi
          fi

          if ! terraform state list | grep -qF "aws_iam_role_policy.github_actions"; then
            if aws iam get-role-policy --role-name task-manager-github-actions --policy-name github-actions >/dev/null 2>&1; then
              terraform import aws_iam_role_policy.github_actions task-manager-github-actions:github-actions
            fi
          fi

      - name: Terraform Apply (bootstrap)
        working-directory: terraform/bootstrap
        run: terraform apply -auto-approve

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: Import existing resources into state
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          import_if_missing() {
            local addr=$1 id=$2
            if ! terraform state list | grep -qF "$addr"; then
              terraform import "$addr" "$id" && echo "Imported $addr" || echo "Skipped $addr (not found in AWS)"
            fi
          }

          # IAM policies
          import_if_missing aws_iam_policy.lbc          "arn:aws:iam::${ACCOUNT_ID}:policy/task-manager-lbc"
          import_if_missing aws_iam_policy.ca           "arn:aws:iam::${ACCOUNT_ID}:policy/task-manager-ca"
          import_if_missing aws_iam_policy.external_dns "arn:aws:iam::${ACCOUNT_ID}:policy/task-manager-external-dns"
          import_if_missing aws_iam_policy.velero        "arn:aws:iam::${ACCOUNT_ID}:policy/task-manager-velero"

          # IAM roles (EKS)
          import_if_missing module.eks.aws_iam_role.cluster "task-manager-eks-cluster-role"
          import_if_missing module.eks.aws_iam_role.node    "task-manager-eks-node-role"
          import_if_missing module.eks.aws_iam_role.fargate "task-manager-eks-fargate-role"

          # ECR repositories
          import_if_missing module.ecr.aws_ecr_repository.backend  "task-manager-backend"
          import_if_missing module.ecr.aws_ecr_repository.frontend "task-manager-frontend"

          # CloudWatch log group
          import_if_missing aws_cloudwatch_log_group.app "/aws/eks/task-manager/app"

      - name: Bootstrap ACM certificate
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
        run: |
          terraform apply -target=aws_acm_certificate.main -auto-approve
          terraform apply \
            -target=aws_route53_record.cert_validation \
            -target=aws_acm_certificate_validation.main \
            -auto-approve

      - name: Terraform Apply
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
        run: terraform apply -auto-approve

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name task-manager-eks

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install external-dns
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/
          helm repo update
          EXTERNAL_DNS_ROLE_ARN=$(terraform output -raw external_dns_role_arn)
          helm upgrade --install external-dns external-dns/external-dns \
            -n kube-system \
            --set provider.name=aws \
            --set env[0].name=AWS_REGION \
            --set env[0].value=${{ secrets.AWS_REGION }} \
            --set txtOwnerId=task-manager-eks \
            --set txtPrefix=edns- \
            --set policy=upsert-only \
            --set serviceAccount.name=external-dns \
            --set "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=${EXTERNAL_DNS_ROLE_ARN}" \
            --wait --timeout 3m

      - name: Install Cluster Autoscaler
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          helm repo add autoscaler https://kubernetes.github.io/autoscaler
          helm repo update
          CA_ROLE_ARN=$(terraform output -raw ca_role_arn)
          helm upgrade --install cluster-autoscaler autoscaler/cluster-autoscaler \
            -n kube-system \
            --set autoDiscovery.clusterName=task-manager-eks \
            --set awsRegion=${{ secrets.AWS_REGION }} \
            --set rbac.serviceAccount.create=true \
            --set rbac.serviceAccount.name=cluster-autoscaler \
            --set "rbac.serviceAccount.annotations.eks\.amazonaws\.com/role-arn=${CA_ROLE_ARN}" \
            --set extraArgs.balance-similar-node-groups=false \
            --set extraArgs.skip-nodes-with-system-pods=false

      - name: Install metrics-server
        run: |
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm repo update
          helm upgrade --install metrics-server metrics-server/metrics-server \
            -n kube-system \
            --set args[0]=--kubelet-insecure-tls \
            --wait --timeout 3m

      - name: Configure Fargate logging
        run: |
          kubectl create namespace aws-observability --dry-run=client -o yaml | kubectl apply -f -
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: aws-logging
            namespace: aws-observability
          data:
            flb_log_cw: "true"
            filters.conf: |
              [FILTER]
                  Name parser
                  Match *
                  Key_name log
                  Parser crio
            output.conf: |
              [OUTPUT]
                  Name cloudwatch_logs
                  Match *
                  region ${{ secrets.AWS_REGION }}
                  log_group_name /aws/eks/task-manager/app
                  log_stream_prefix fargate/
                  auto_create_group true
            parsers.conf: |
              [PARSER]
                  Name crio
                  Format Regex
                  Regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>P|F) (?<log>.*)$
                  Time_Key time
                  Time_Format %Y-%m-%dT%H:%M:%S.%L%z
          EOF

      - name: Install Fluent Bit
        run: |
          helm repo add eks https://aws.github.io/eks-charts || true
          helm repo update
          helm upgrade --install aws-for-fluent-bit eks/aws-for-fluent-bit \
            -n kube-system \
            --set cloudWatch.enabled=true \
            --set cloudWatch.region=${{ secrets.AWS_REGION }} \
            --set cloudWatch.logGroupName=/aws/eks/task-manager/app \
            --set cloudWatch.logStreamPrefix=from-eks/ \
            --set firehose.enabled=false \
            --set kinesis.enabled=false \
            --set elasticsearch.enabled=false

      - name: Install AWS Load Balancer Controller
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          helm repo add eks https://aws.github.io/eks-charts || true
          helm repo update
          LBC_ROLE_ARN=$(terraform output -raw lbc_role_arn)
          VPC_ID=$(terraform output -raw vpc_id)
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            -n kube-system \
            --set clusterName=task-manager-eks \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=${LBC_ROLE_ARN}" \
            --set region=${{ secrets.AWS_REGION }} \
            --set vpcId=${VPC_ID} \
            --wait --timeout 5m

      - name: Install Velero
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          helm repo add vmware-tanzu https://vmware-tanzu.github.io/helm-charts
          helm repo update
          VELERO_ROLE_ARN=$(terraform output -raw velero_role_arn)
          VELERO_BUCKET=$(terraform output -raw velero_bucket)
          kubectl create namespace velero --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install velero vmware-tanzu/velero \
            -n velero \
            -f ../helm/velero/values.yaml \
            --set configuration.backupStorageLocation[0].name=default \
            --set configuration.backupStorageLocation[0].provider=aws \
            --set configuration.backupStorageLocation[0].bucket=${VELERO_BUCKET} \
            --set configuration.backupStorageLocation[0].config.region=${{ secrets.AWS_REGION }} \
            --set configuration.volumeSnapshotLocation[0].name=default \
            --set configuration.volumeSnapshotLocation[0].provider=aws \
            --set configuration.volumeSnapshotLocation[0].config.region=${{ secrets.AWS_REGION }} \
            --set "serviceAccount.server.annotations.eks\.amazonaws\.com/role-arn=${VELERO_ROLE_ARN}" \
            --set initContainers[0].name=velero-plugin-for-aws \
            --set initContainers[0].image=velero/velero-plugin-for-aws:v1.10.0 \
            --set initContainers[0].volumeMounts[0].mountPath=/target \
            --set initContainers[0].volumeMounts[0].name=plugins \
            --set credentials.useSecret=false

      - name: Create namespaces and db-secrets
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          RDS_HOST=$(terraform output -raw rds_endpoint)
          declare -A DB_NAMES=([prod]="taskmanager" [dev]="taskmanager_dev")
          for NS in prod dev; do
            DB_URL="postgresql://taskuser:${{ secrets.TF_DB_PASSWORD }}@${RDS_HOST}:5432/${DB_NAMES[$NS]}"
            kubectl create namespace $NS --dry-run=client -o yaml | kubectl apply -f -
            kubectl create secret generic db-secret -n $NS \
              --from-literal=DATABASE_URL="$DB_URL" \
              --dry-run=client -o yaml | kubectl apply -f -
          done

