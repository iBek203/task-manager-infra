name: Terraform Destroy

on:
  workflow_dispatch:

env:
  TF_VERSION: "1.10.5"
  WORKING_DIR: terraform

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name task-manager-eks

      - name: Uninstall Helm releases
        run: |
          helm uninstall task-manager -n prod --ignore-not-found || true
          helm uninstall task-manager -n dev --ignore-not-found || true
          helm uninstall external-dns -n kube-system --ignore-not-found || true
          sleep 60

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: Terraform Destroy
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
        run: terraform destroy -auto-approve
