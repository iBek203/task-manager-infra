name: Terraform Destroy

on:
  workflow_dispatch:

env:
  TF_VERSION: "1.10.5"
  WORKING_DIR: terraform

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::981548928508:role/task-manager-github-actions
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Uninstall Helm releases and wait for ALB deletion
        run: |
          if ! aws eks describe-cluster --name task-manager-eks --region ${{ secrets.AWS_REGION }} > /dev/null 2>&1; then
            echo "Cluster not found, skipping Helm cleanup"
            exit 0
          fi

          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name task-manager-eks

          helm uninstall frontend -n prod --ignore-not-found || true
          helm uninstall frontend -n dev --ignore-not-found || true
          helm uninstall backend -n prod --ignore-not-found || true
          helm uninstall backend -n dev --ignore-not-found || true

          echo "Waiting for ALBs to be deleted..."
          for i in $(seq 1 60); do
            COUNT=$(aws elbv2 describe-load-balancers \
              --region ${{ secrets.AWS_REGION }} \
              --query "length(LoadBalancers[?contains(LoadBalancerName,'k8s')])" \
              --output text 2>/dev/null || echo "0")
            echo "Attempt $i/60: ${COUNT} ALB(s) remaining"
            [ "$COUNT" = "0" ] && break
            sleep 10
          done

          echo "Waiting 60s for ENIs to be released..."
          sleep 60

          # Remove system components
          helm uninstall aws-for-fluent-bit -n kube-system --ignore-not-found || true
          helm uninstall cluster-autoscaler -n kube-system --ignore-not-found || true
          helm uninstall aws-load-balancer-controller -n kube-system --ignore-not-found || true
          helm uninstall external-dns -n kube-system --ignore-not-found || true
          helm uninstall velero -n velero --ignore-not-found || true

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: Terraform Destroy
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
        run: |
          terraform state rm aws_iam_openid_connect_provider.github || true
          terraform state rm aws_iam_role.github_actions || true
          terraform state rm aws_iam_role_policy.github_actions || true
          terraform state rm aws_eks_access_entry.github_actions || true
          terraform state rm aws_eks_access_policy_association.github_actions || true

          terraform state rm aws_acm_certificate_validation.main || true
          terraform state rm aws_ssm_parameter.acm_cert_arn || true
          for addr in $(terraform state list | grep 'aws_route53_record.cert_validation'); do
            terraform state rm "$addr" || true
          done
          terraform state rm aws_acm_certificate.main || true

          terraform destroy -auto-approve
