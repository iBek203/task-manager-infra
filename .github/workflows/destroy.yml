name: Terraform Destroy

on:
  workflow_dispatch:

env:
  TF_VERSION: "1.10.5"
  WORKING_DIR: terraform

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Uninstall Helm releases and wait for ALB deletion
        run: |
          if ! aws eks describe-cluster --name task-manager-eks --region ${{ secrets.AWS_REGION }} > /dev/null 2>&1; then
            echo "Cluster not found, skipping Helm cleanup"
            exit 0
          fi

          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name task-manager-eks

          helm uninstall frontend -n prod --ignore-not-found || true
          helm uninstall frontend -n dev --ignore-not-found || true
          helm uninstall backend -n prod --ignore-not-found || true
          helm uninstall backend -n dev --ignore-not-found || true

          echo "Waiting for ALBs to be deleted..."
          for i in $(seq 1 60); do
            COUNT=$(aws elbv2 describe-load-balancers \
              --region ${{ secrets.AWS_REGION }} \
              --query "length(LoadBalancers[?contains(LoadBalancerName,'k8s')])" \
              --output text 2>/dev/null || echo "0")
            echo "Attempt $i/60: ${COUNT} ALB(s) remaining"
            [ "$COUNT" = "0" ] && break
            sleep 10
          done

          echo "Waiting 60s for ENIs to be released..."
          sleep 60

          # Remove system components
          helm uninstall aws-for-fluent-bit -n kube-system --ignore-not-found || true
          helm uninstall metrics-server -n kube-system --ignore-not-found || true
          helm uninstall cluster-autoscaler -n kube-system --ignore-not-found || true
          helm uninstall aws-load-balancer-controller -n kube-system --ignore-not-found || true
          helm uninstall external-dns -n kube-system --ignore-not-found || true
          helm uninstall velero -n velero --ignore-not-found || true

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: Drain EKS node group
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
        run: |
          terraform destroy \
            -target=module.eks.aws_eks_node_group.prod \
            -auto-approve

      - name: Delete orphaned VPC resources (ENIs + LBC security groups)
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=task-manager-vpc" \
            --query 'Vpcs[0].VpcId' --output text 2>/dev/null || echo "")
          if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
            echo "VPC not found, skipping cleanup"
            exit 0
          fi
          echo "VPC: $VPC_ID"

          echo "--- Deleting orphaned ENIs ---"
          ENI_IDS=$(aws ec2 describe-network-interfaces \
            --filters \
              "Name=vpc-id,Values=${VPC_ID}" \
              "Name=status,Values=available" \
            --query 'NetworkInterfaces[*].NetworkInterfaceId' \
            --output text)
          for ENI in $ENI_IDS; do
            echo "Deleting ENI $ENI"
            aws ec2 delete-network-interface --network-interface-id "$ENI" || true
          done

          echo "--- Deleting LBC-managed security groups ---"
          SG_IDS=$(aws ec2 describe-security-groups \
            --filters \
              "Name=vpc-id,Values=${VPC_ID}" \
              "Name=tag-key,Values=elbv2.k8s.aws/cluster" \
            --query 'SecurityGroups[*].GroupId' \
            --output text)
          # also catch SGs named k8s-* not yet tagged
          SG_IDS_K8S=$(aws ec2 describe-security-groups \
            --filters \
              "Name=vpc-id,Values=${VPC_ID}" \
              "Name=group-name,Values=k8s-*" \
            --query 'SecurityGroups[*].GroupId' \
            --output text)
          for SG in $SG_IDS $SG_IDS_K8S; do
            echo "Deleting SG $SG"
            aws ec2 delete-security-group --group-id "$SG" || true
          done
          echo "Done"

      - name: Terraform Destroy
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
        run: terraform destroy -auto-approve
