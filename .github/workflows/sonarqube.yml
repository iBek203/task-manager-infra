name: SonarQube Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'terraform-sonarqube/**'

env:
  TF_VERSION: "1.10.5"
  WORKING_DIR: terraform-sonarqube

jobs:
  deploy:
    name: Deploy SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -auto-approve

      - name: Get SonarQube instance ID
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=task-manager-sonarqube" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)
          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV

      - name: Wait for SSM agent to be ready
        run: |
          echo "Waiting for SSM agent on $INSTANCE_ID..."
          for i in $(seq 1 40); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || echo "None")
            echo "Attempt $i: $STATUS"
            [ "$STATUS" = "Online" ] && break
            sleep 15
          done
          [ "$STATUS" = "Online" ] || (echo "SSM agent not ready after 10 minutes" && exit 1)

      - name: Setup SonarQube via SSM Run Command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "SONAR_URL=http://localhost:9000",
              "REGION=$(curl -s http://169.254.169.254/latest/meta-data/placement/region)",

              "# Wait for SonarQube to be UP",
              "for i in $(seq 1 40); do STATUS=$(curl -s $SONAR_URL/api/system/status | jq -r .status 2>/dev/null || echo \"\"); [ \"$STATUS\" = \"UP\" ] && break; sleep 15; done",
              "[ \"$STATUS\" = \"UP\" ] || (echo \"SonarQube not UP\" && exit 1)",

              "# Check if SSM already has a working password",
              "STORED_PASS=$(aws ssm get-parameter --region $REGION --name /task-manager/sonarqube-admin-password --with-decryption --query Parameter.Value --output text 2>/dev/null || echo \"\")",
              "VALID=$(curl -s -u \"admin:$STORED_PASS\" $SONAR_URL/api/authentication/validate | jq -r .valid 2>/dev/null || echo \"false\")",

              "if [ \"$VALID\" != \"true\" ]; then",
              "  echo \"Stored password invalid, resetting SonarQube...\"",
              "  docker stop sonarqube || true",
              "  docker rm sonarqube || true",
              "  docker volume rm sonarqube_data sonarqube_logs sonarqube_extensions 2>/dev/null || true",
              "  mkdir -p /opt/sonarqube/{data,logs,extensions}",
              "  chown -R 1000:1000 /opt/sonarqube",
              "  docker run -d --name sonarqube --restart always -p 9000:9000 -e SONAR_WEB_JAVAOPTS=\"-Xmx512m -Xms128m\" -e SONAR_CE_JAVAOPTS=\"-Xmx512m -Xms128m\" -e SONAR_SEARCH_JAVAOPTS=\"-Xmx512m -Xms512m -XX:MaxDirectMemorySize=256m\" -v /opt/sonarqube/data:/opt/sonarqube/data -v /opt/sonarqube/logs:/opt/sonarqube/logs -v /opt/sonarqube/extensions:/opt/sonarqube/extensions sonarqube:community",
              "  for i in $(seq 1 40); do STATUS=$(curl -s $SONAR_URL/api/system/status | jq -r .status 2>/dev/null || echo \"\"); [ \"$STATUS\" = \"UP\" ] && break; sleep 15; done",
              "  [ \"$STATUS\" = \"UP\" ] || (echo \"SonarQube failed to restart\" && exit 1)",
              "  NEW_PASS=\"Sonar@$(openssl rand -hex 12)\"",
              "  curl -s -u admin:admin -X POST $SONAR_URL/api/users/change_password -d \"login=admin&previousPassword=admin&password=$NEW_PASS\"",
              "  STORED_PASS=$NEW_PASS",
              "  aws ssm put-parameter --region $REGION --name /task-manager/sonarqube-admin-password --value \"$STORED_PASS\" --type SecureString --overwrite",
              "fi",

              "# Create projects",
              "for PROJECT in task-manager-backend task-manager-frontend; do curl -s -u \"admin:$STORED_PASS\" -X POST $SONAR_URL/api/projects/create -d \"name=$PROJECT&project=$PROJECT\" || true; done",

              "# Revoke old token and generate new one",
              "curl -s -u \"admin:$STORED_PASS\" -X POST $SONAR_URL/api/user_tokens/revoke -d \"name=ci-token\" || true",
              "TOKEN=$(curl -s -u \"admin:$STORED_PASS\" -X POST $SONAR_URL/api/user_tokens/generate -d \"name=ci-token&type=GLOBAL_ANALYSIS_TOKEN\" | jq -r .token)",
              "[ -n \"$TOKEN\" ] || (echo \"Token generation failed\" && exit 1)",
              "aws ssm put-parameter --region $REGION --name /task-manager/sonarqube-token --value \"$TOKEN\" --type SecureString --overwrite",
              "SONAR_URL_PUBLIC=\"http://$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4):9000\"",
              "aws ssm put-parameter --region $REGION --name /task-manager/sonarqube-url --value \"$SONAR_URL_PUBLIC\" --type String --overwrite",
              "echo \"SonarQube setup complete: $SONAR_URL_PUBLIC\""
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i: $STATUS"
            [ "$STATUS" = "Success" ] && break
            [ "$STATUS" = "Failed" ] && (aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text && exit 1)
            sleep 20
          done
          [ "$STATUS" = "Success" ] || (echo "SSM command timed out" && exit 1)

      - name: Show SonarQube URL
        run: |
          echo "SonarQube URL: $(aws ssm get-parameter --name /task-manager/sonarqube-url --query Parameter.Value --output text)"
