name: SonarQube Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'terraform-sonarqube/**'

env:
  TF_VERSION: "1.10.5"
  WORKING_DIR: terraform-sonarqube

jobs:
  deploy:
    name: Deploy SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -replace=aws_instance.sonarqube -auto-approve

      - name: Wait for SonarQube to be UP
        id: wait
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          SONAR_URL=$(terraform output -raw sonarqube_url)
          echo "sonar_url=$SONAR_URL" >> $GITHUB_OUTPUT
          echo "Waiting 3 min for EC2 to finish booting and Docker to install..."
          sleep 180
          echo "Polling SonarQube at $SONAR_URL (up to 15 min)..."
          for i in $(seq 1 60); do
            STATUS=$(curl -s --max-time 10 "$SONAR_URL/api/system/status" | jq -r '.status // empty' 2>/dev/null || echo "")
            echo "Attempt $i/60: status=$STATUS"
            [ "$STATUS" = "UP" ] && exit 0
            sleep 15
          done
          echo "ERROR: SonarQube did not come up in 15 minutes"
          exit 1

      - name: Diagnose EC2 on failure
        if: failure()
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=task-manager-sonarqube" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          echo "EC2 Instance: $INSTANCE_ID"
          aws ec2 get-console-output --instance-id "$INSTANCE_ID" --output text || true

      - name: Configure SonarQube and update SSM
        run: |
          SONAR_URL="${{ steps.wait.outputs.sonar_url }}"

          # Skip setup if SSM already has valid credentials for this URL
          EXISTING_TOKEN=$(aws ssm get-parameter --name /task-manager/sonarqube-token \
            --with-decryption --query Parameter.Value --output text 2>/dev/null || echo "")
          SSM_URL=$(aws ssm get-parameter --name /task-manager/sonarqube-url \
            --query Parameter.Value --output text 2>/dev/null || echo "")
          if [ -n "$EXISTING_TOKEN" ] && [ "$SSM_URL" = "$SONAR_URL" ]; then
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              -u "$EXISTING_TOKEN:" "$SONAR_URL/api/authentication/validate")
            if [ "$HTTP" = "200" ]; then
              echo "SSM credentials are valid for $SONAR_URL — skipping setup."
              exit 0
            fi
          fi

          echo "Running first-time setup for $SONAR_URL..."
          ADMIN_PASS="Sonar@$(openssl rand -hex 12)"

          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -u admin:admin -X POST "$SONAR_URL/api/users/change_password" \
            -d "login=admin&previousPassword=admin&password=$ADMIN_PASS")
          if [ "$HTTP" != "204" ] && [ "$HTTP" != "200" ]; then
            echo "ERROR: Password change failed (HTTP $HTTP)"
            exit 1
          fi
          echo "Admin password changed."

          aws ssm put-parameter --name /task-manager/sonarqube-admin-password \
            --value "$ADMIN_PASS" --type SecureString --overwrite

          for PROJECT in task-manager-backend task-manager-frontend; do
            curl -s -u "admin:$ADMIN_PASS" -X POST "$SONAR_URL/api/projects/create" \
              -d "name=$PROJECT&project=$PROJECT"
            echo "Project $PROJECT created."
          done

          TOKEN=$(curl -s -u "admin:$ADMIN_PASS" -X POST "$SONAR_URL/api/user_tokens/generate" \
            -d "name=ci-token&type=GLOBAL_ANALYSIS_TOKEN" | jq -r '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: Failed to generate CI token"
            exit 1
          fi

          aws ssm put-parameter --name /task-manager/sonarqube-token \
            --value "$TOKEN" --type SecureString --overwrite
          aws ssm put-parameter --name /task-manager/sonarqube-url \
            --value "$SONAR_URL" --type String --overwrite

          echo "Setup complete. SonarQube ready at $SONAR_URL"
