name: SonarQube Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'terraform-sonarqube/**'

env:
  TF_VERSION: "1.10.5"
  WORKING_DIR: terraform-sonarqube

jobs:
  deploy:
    name: Deploy SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -auto-approve

      - name: Show SonarQube URL
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform output -raw sonarqube_url

      - name: Wait for SonarQube user_data to complete
        run: |
          echo "Polling SSM until sonarqube-token is populated (up to 20 min)..."
          for i in $(seq 1 40); do
            TOKEN=$(aws ssm get-parameter \
              --name /task-manager/sonarqube-token \
              --with-decryption \
              --query Parameter.Value \
              --output text 2>/dev/null || echo "")
            if [ -n "$TOKEN" ] && [ "$TOKEN" != "None" ]; then
              echo "SonarQube is ready (attempt $i)"
              URL=$(aws ssm get-parameter \
                --name /task-manager/sonarqube-url \
                --query Parameter.Value \
                --output text)
              echo "SonarQube URL: $URL"
              exit 0
            fi
            echo "Attempt $i/40: SSM not ready yet, retrying in 30s..."
            sleep 30
          done
          echo "ERROR: SonarQube setup did not complete within 20 minutes"
          exit 1
