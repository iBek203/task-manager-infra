apiVersion: batch/v1
kind: Job
metadata:
  name: db-init-{{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      containers:
        - name: db-init
          image: postgres:15
          command:
            - /bin/sh
            - -c
            - |
              DB_NAME="${DATABASE_URL##*/}"
              DB_NAME="${DB_NAME%%\?*}"
              POSTGRES_URL="${DATABASE_URL%/*}/postgres"
              psql "$POSTGRES_URL" -c "CREATE DATABASE \"${DB_NAME}\";" || true
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbSecret }}
                  key: DATABASE_URL
      restartPolicy: Never
