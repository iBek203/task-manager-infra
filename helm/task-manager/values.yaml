image:
  registry: 981548928508.dkr.ecr.us-east-1.amazonaws.com

env: dev
dbSecret: db-secret

ingress:
  enabled: false
  hostname: ""
  certificateArn: ""

backend:
  enabled: true
  replicas: 1
  image: task-manager-backend
  tag: latest
  nodeSelector: {}
  resources:
    requests:
      cpu: "256m"
      memory: "512Mi"
    limits:
      cpu: "512m"
      memory: "1Gi"

frontend:
  enabled: true
  replicas: 1
  image: task-manager-frontend
  tag: latest
  nodeSelector: {}
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: "256m"
      memory: "512Mi"
    limits:
      cpu: "512m"
      memory: "1Gi"

autoscaling:
  enabled: false
  backend:
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  frontend:
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
